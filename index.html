<!doctype html>
<html lang="zh-CN">
<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:Impact,"Arial Black","PingFang SC","Microsoft YaHei",sans-serif}button{font-family:inherit}#app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.24),transparent 18%),radial-gradient(circle at 80% 10%,rgba(255,0,0,.42),transparent 24%),linear-gradient(135deg,#050505 0%,#101010 36%,#b00014 37%,#e60012 50%,#090909 51%,#000 100%)}.slash-white{position:absolute;left:-28vw;top:0;width:26vw;height:150vh;background:rgba(255,255,255,.92);transform:rotate(18deg);animation:slashFloat 4s infinite}.ring{position:absolute;right:-90px;top:-90px;width:280px;height:280px;border-radius:50%;border:30px solid rgba(255,255,255,.82);animation:spin 10s linear infinite}.screen{position:relative;z-index:2;max-width:460px;height:100%;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.label{display:inline-block;background:#fff;color:#000;padding:6px 10px;font-size:12px;letter-spacing:.22em;font-weight:900;transform:skewX(-12deg)}h1{margin:8px 0 0;font-size:42px;line-height:.92;letter-spacing:-2px;text-shadow:6px 6px 0 #e60012}.iconBtns{display:flex;gap:8px}.iconBtn{width:44px;height:44px;border-radius:99px;border:0;background:#fff;color:#000;font-size:20px;font-weight:900;box-shadow:4px 4px 0 #000}.iconBtn.red{background:#e60012;color:#fff}.bgm{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:11px;letter-spacing:.12em;font-weight:900;color:rgba(255,255,255,.82)}.machine{margin:18px 0 14px;border:4px solid #fff;border-radius:28px;background:rgba(0,0,0,.76);padding:12px;box-shadow:12px 12px 0 #e60012;backdrop-filter:blur(8px)}.machine.shake{animation:shake .16s infinite}.status{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.phase{background:#e60012;color:#fff;padding:5px 10px;transform:skewX(-12deg);font-size:11px;letter-spacing:.18em;font-weight:900}.pool{font-size:11px;color:rgba(255,255,255,.64);font-weight:900}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.reel{height:38dvh;max-height:175px;min-height:132px;position:relative;border:2px solid #fff;border-radius:18px;overflow:hidden;background:#fff;color:#000}.reel:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#fff 0%,#fff 42%,#e60012 43%,#e60012 55%,#111 56%);opacity:.92}.reel.spin{animation:reelShake .12s infinite}.foodInner{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}.emoji{font-size:52px;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.25))}.foodName{font-size:14px;line-height:1.05;font-weight:900;margin-top:8px}.rarity{margin-top:5px;background:#000;color:#fff;font-size:10px;font-weight:900;padding:2px 7px}.result{position:relative;overflow:hidden;border:4px solid #fff;border-radius:28px;background:#fff;color:#000;box-shadow:12px 12px 0 #111;animation:pop .55s cubic-bezier(.2,1.4,.3,1)}.result:before{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;background:#e60012;border-radius:50%}.result:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:28px;background:#000}.resultBody{position:relative;z-index:1;padding:18px}.resultHead{display:flex;justify-content:space-between;align-items:center}.rarityBig{background:#000;color:#fff;padding:5px 10px;transform:skewX(-12deg);font-size:11px;letter-spacing:.15em;font-weight:900}.mainFood{display:flex;align-items:flex-end;gap:12px;margin-top:14px}.bigEmoji{font-size:72px}.destiny{font-size:11px;color:#e60012;letter-spacing:.22em;font-weight:900}.resultName{font-size:36px;line-height:.95;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-bottom:18px;text-align:center}.stat{background:#000;color:#fff;border-radius:12px;padding:8px}.stat small{display:block;font-size:9px;opacity:.58}.stat b{font-size:16px}.cta{margin-top:auto;padding-top:14px}.rollBtn{width:100%;height:64px;border:4px solid #fff;border-radius:18px;background:#e60012;color:#fff;font-size:20px;font-weight:900;letter-spacing:.15em;box-shadow:8px 8px 0 #000}.rollBtn:active{transform:translateY(2px)}.tip{text-align:center;margin-top:9px;font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.64);font-weight:900}.lines{pointer-events:none;position:absolute;inset:0;overflow:hidden;opacity:.7}.line{position:absolute;left:-45%;height:3px;background:#fff;animation:lineMove .55s linear infinite}.particles{pointer-events:none;position:absolute;inset:0;overflow:hidden}.dot{position:absolute;border-radius:50%;background:#fff;mix-blend-mode:screen;opacity:.4;animation:float 2.4s infinite}.cutin{pointer-events:none;position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;overflow:hidden}.cutin.show{display:flex}.flash{position:fixed;inset:0;background:#fff;z-index:9;pointer-events:none;opacity:0}.flash.go{animation:flash .34s infinite;mix-blend-mode:difference}.black{position:absolute;inset:0;background:#000;opacity:.88}.redFlash{position:absolute;inset:0;background:#e60012;mix-blend-mode:screen;animation:redPulse .38s infinite}.warningBox{text-align:center;animation:pulse .28s infinite}.warningBox .skull{font-size:64px}.warningText{font-size:58px;font-weight:900;text-shadow:8px 8px 0 #000}.warningSub{display:inline-block;background:#fff;color:#e60012;padding:5px 12px;font-size:12px;letter-spacing:.2em;font-weight:900}.execute{font-size:64px;line-height:.9;font-weight:900;text-align:center;text-shadow:9px 9px 0 #e60012;animation:execute .55s cubic-bezier(.2,1.4,.3,1)}.executeSub{display:inline-block;margin-top:10px;background:#fff;color:#000;padding:5px 14px;transform:skewX(-12deg);font-size:18px}.manga{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:18px}.panel{display:flex;align-items:center;justify-content:center;border:4px solid #fff;background:#000;color:#fff;font-size:24px;font-weight:900;box-shadow:7px 7px 0 #e60012;transform:skewX(-7deg);animation:panel .35s both}.cutSlashA,.cutSlashB{position:absolute;left:-40%;width:160%;height:110px}.cutSlashA{top:18%;background:#fff;transform:rotate(-12deg);animation:slashA .58s}.cutSlashB{bottom:22%;background:#e60012;transform:rotate(12deg);animation:slashB .58s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes slashFloat{50%{transform:translateX(18px) rotate(18deg)}}@keyframes shake{0%,100%{transform:translate(0) rotate(0)}25%{transform:translate(-2px,1px) rotate(-1deg)}50%{transform:translate(2px,-1px) rotate(1deg)}75%{transform:translate(-1px,-2px) rotate(.5deg)}}@keyframes reelShake{50%{transform:translateY(-14px);filter:blur(4px)}}@keyframes pop{0%{opacity:0;transform:translateY(50px) scale(.35) rotate(-16deg)}100%{opacity:1;transform:none}}@keyframes lineMove{to{transform:translateX(150vw)}}@keyframes float{50%{transform:translateY(-24px) scale(1.2);opacity:.8}}@keyframes flash{0%,100%{opacity:0}35%{opacity:.22}55%{opacity:0}75%{opacity:.12}}@keyframes redPulse{0%,100%{opacity:0}45%{opacity:.85}}@keyframes pulse{50%{transform:scale(1.12)}}@keyframes execute{0%{transform:scale(.2) rotate(-18deg)}40%{transform:scale(1.4) rotate(8deg)}70%{transform:scale(.95) rotate(-4deg)}100%{transform:scale(1) rotate(0)}}@keyframes panel{0%{transform:scale(0) rotate(-8deg) skewX(-7deg)}100%{transform:scale(1) rotate(3deg) skewX(-7deg)}}@keyframes slashA{from{transform:translateX(-100%) rotate(-12deg)}to{transform:translateX(100%) rotate(-12deg)}}@keyframes slashB{from{transform:translateX(100%) rotate(12deg)}to{transform:translateX(-100%) rotate(12deg)}}@media(max-height:700px){h1{font-size:34px}.machine{margin:12px 0}.reel{height:132px}.bigEmoji{font-size:58px}.resultName{font-size:30px}.rollBtn{height:58px}.stats{margin-top:10px}.resultBody{padding:14px}}
</style>
</head>
<body>
<div id="app">
  <div class="slash-white"></div><div class="ring"></div><div class="lines" id="lines"></div><div class="particles" id="particles"></div><div class="flash" id="flash"></div>
  <div class="cutin" id="cutin"></div>
  <main class="screen">
    <header class="top">
      <div><div class="label">DINNER MISSION</div><h1>命运晚餐<br>处决老虎机</h1></div>
      <div class="iconBtns"><button class="iconBtn" id="muteBtn">🔊</button><button class="iconBtn red" id="bgmBtn">♫</button></div>
    </header>
    <div class="bgm">✦ BGM: <span id="bgmName">Last Surprise</span></div>
    <section class="machine" id="machine">
      <div class="status"><span class="phase" id="phase">IDLE</span><span class="pool" id="pool">POOL 120</span></div>
      <div class="reels"><div class="reel"><div class="foodInner" id="r0"></div></div><div class="reel"><div class="foodInner" id="r1"></div></div><div class="reel"><div class="foodInner" id="r2"></div></div></div>
    </section>
    <section class="result" id="result"></section>
    <div class="cta"><button class="rollBtn" id="rollBtn">开始处决</button><div class="tip">手机打开 index.html；首次点击会解锁音乐和音效</div></div>
  </main>
</div>
<audio id="bgm" loop preload="auto" src="assets/last_surprise.m4a"></audio>
<script>
const FOOD_NAMES=["麻婆豆腐","宫保鸡丁","鱼香肉丝","水煮牛肉","回锅肉","红烧肉","糖醋里脊","番茄炒蛋","清蒸鲈鱼","葱爆羊肉","酸菜鱼","辣子鸡","地三鲜","梅菜扣肉","锅包肉","白切鸡","东坡肉","小炒黄牛肉","蚂蚁上树","干煸四季豆","牛肉面","炸酱面","热干面","担担面","阳春面","兰州拉面","重庆小面","刀削面","葱油拌面","云吞面","扬州炒饭","煲仔饭","卤肉饭","黄焖鸡米饭","咖喱鸡饭","叉烧饭","腊味饭","海南鸡饭","肥牛饭","照烧鸡腿饭","小笼包","生煎包","锅贴","水饺","烧麦","肠粉","肉夹馍","煎饼果子","鸡蛋灌饼","葱油饼","火锅","串串香","麻辣烫","冒菜","烤鱼","烧烤","铁板牛肉","砂锅粉","酸辣粉","螺蛳粉","皮蛋瘦肉粥","海鲜粥","鸡丝粥","银耳羹","排骨汤","冬瓜汤","番茄牛腩汤","紫菜蛋花汤","老鸭汤","玉米排骨汤","西兰花鸡胸肉","清蒸鸡腿","香煎三文鱼","藜麦牛肉碗","糙米鸡腿饭","低脂虾仁沙拉","番茄豆腐汤","杂粮饭套餐","无糖酸奶碗","鸡蛋牛油果沙拉","控糖鸡胸饭","控糖豆腐煲","控糖牛肉蔬菜碗","控糖海鲜汤","控糖蒸鱼套餐","控糖蘑菇鸡腿","控糖虾仁西兰花","控糖番茄鸡蛋","控糖糙米便当","控糖清炒时蔬","寿司拼盘","刺身饭","鳗鱼饭","天妇罗","咖喱猪排饭","韩式拌饭","部队锅","越南河粉","泰式炒河粉","冬阴功汤","烤冷面","东北乱炖","新疆大盘鸡","羊肉泡馍","胡辣汤","桂林米粉","肠旺面","过桥米线","潮汕牛肉丸","潮汕砂锅粥","帝王蟹盛宴","和牛烧肉","龙虾伊面","佛跳墙","烤鸭全套","海鲜大咖","黑松露牛排","SSR深夜火锅","传说级烧烤","命运之麻辣香锅"];
const EMOJI=["🍜","🥘","🍚","🥟","🍲","🥗","🍛","🔥","🥢","🍖","🦀","🍗"];const BGM=[{name:"Last Surprise",src:"assets/last_surprise.m4a"},{name:"Wake Up Get Up Get",src:"assets/wake_up_get_up.m4a"}];
function pickRarity(i){if(i>=FOOD_NAMES.length-10)return"SSR";let r=Math.random();return r<.035?"SSR":r<.15?"SR":r<.43?"R":"N"}function makeFood(name,i){let healthy=/控糖|鸡胸|藜麦|糙米|沙拉|西兰花|蒸|低脂|杂粮|无糖|牛油果/.test(name);return{id:i+1,name,rarity:pickRarity(i),emoji:EMOJI[i%EMOJI.length],calories:healthy?Math.floor(260+Math.random()*240):Math.floor(420+Math.random()*560),health:healthy?Math.floor(82+Math.random()*17):Math.floor(35+Math.random()*52),sugarSafe:healthy||Math.random()>.78}}
const foods=FOOD_NAMES.map(makeFood);pool.textContent=`POOL ${foods.length}`;let spinning=false,bgmIndex=0,muted=false,result=foods[0],ctx=null;const bgm=document.getElementById('bgm');bgm.volume=.38;
function audioCtx(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function beep(freq=440,dur=.08,type='square',gain=.05,slide=0){if(muted)return;let c=audioCtx(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(35,freq+slide),c.currentTime+dur);g.gain.setValueAtTime(gain,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur)}function noise(dur=.14,gain=.05){if(muted)return;let c=audioCtx(),b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.2);let s=c.createBufferSource(),g=c.createGain();g.gain.value=gain;s.buffer=b;s.connect(g);g.connect(c.destination);s.start()}const S={click(){beep(900,.045,'square',.04,420);noise(.035,.015)},whoosh(){noise(.22,.06);beep(130,.18,'sawtooth',.04,960)},tick(i){beep(520+i*18,.032,'square',.032)},warning(){beep(96,.22,'sawtooth',.075,-32);setTimeout(()=>beep(980,.08,'square',.04),90)},slash(){noise(.08,.08);beep(1300,.075,'sawtooth',.04,900)},boom(){noise(.45,.14);beep(58,.4,'sawtooth',.18,-20);setTimeout(()=>beep(1200,.09,'triangle',.05,500),65)},shine(){beep(1600,.12,'triangle',.035,1000);setTimeout(()=>beep(2400,.07,'sine',.025,300),55)}};
function randFood(){return foods[Math.floor(Math.random()*foods.length)]}function foodHTML(f){return `<div class="emoji">${f.emoji}</div><div class="foodName">${f.name}</div><div class="rarity">${f.rarity}</div>`}function drawReels(arr){arr.forEach((f,i)=>document.getElementById('r'+i).innerHTML=foodHTML(f))}function drawResult(f){let label=f.rarity==='SSR'?'EXECUTION SSR':f.rarity==='SR'?'SUPER RARE':f.rarity==='R'?'RARE':'NORMAL';result=f;document.getElementById('result').innerHTML=`<div class="resultBody"><div class="resultHead"><div class="rarityBig">${label}</div><div style="color:#e60012;font-size:28px">⌖</div></div><div class="mainFood"><div class="bigEmoji">${f.emoji}</div><div><div class="destiny">TODAY'S DESTINY</div><div class="resultName">${f.name}</div></div></div><div class="stats"><div class="stat"><small>KCAL</small><b>${f.calories}</b></div><div class="stat"><small>HEALTH</small><b>${f.health}</b></div><div class="stat"><small>控糖</small><b>${f.sugarSafe?'OK':'NO'}</b></div></div></div>`}
function cut(type,f){const c=document.getElementById('cutin');c.className='cutin show';if(type==='none'){c.className='cutin';c.innerHTML='';return}if(type==='slash')c.innerHTML='<div class="cutSlashA"></div><div class="cutSlashB"></div>';if(type==='manga')c.innerHTML='<div class="manga">'+['TARGET','MENU','CALORIE','DESTINY'].map((x,i)=>`<div class="panel" style="animation-delay:${i*.08}s">${x}</div>`).join('')+'</div>';if(type==='black')c.innerHTML='<div class="black"></div>';if(type==='warning')c.innerHTML='<div class="black"></div><div class="redFlash"></div><div class="warningBox"><div class="skull">☠</div><div class="warningText">WARNING</div><div class="warningSub">RARE DESTINY DETECTED</div></div>';if(type==='execute')c.innerHTML=`<div class="execute">EXECUTE<br><span class="executeSub">${f.name}</span></div>`}
function setPhase(t){document.getElementById('phase').textContent=t}function startRoll(){if(spinning)return;audioCtx();bgm.play().catch(()=>{});spinning=true;S.click();S.whoosh();rollBtn.textContent='EXECUTING...';machine.classList.add('shake');document.querySelectorAll('.reel').forEach(x=>x.classList.add('spin'));flash.classList.add('go');setPhase('SEARCHING MENU');let final=randFood(),count=0;let inter=setInterval(()=>{count++;drawReels([randFood(),randFood(),randFood()]);if(count%2===0)S.tick(count)},58);setTimeout(()=>{setPhase('TARGET ACQUIRED');cut('slash');S.slash()},620);setTimeout(()=>{setPhase('ANALYZING CALORIES');cut('manga');S.slash()},1180);setTimeout(()=>{setPhase('LOCKING DESTINY');cut('black');S.warning()},1880);setTimeout(()=>{if(final.rarity==='SSR'||final.rarity==='SR'){setPhase('EXECUTION WARNING');cut('warning');S.warning()}else{setPhase('FINAL JUDGEMENT');cut('execute',final);S.slash()}},2350);setTimeout(()=>{cut('execute',final);S.slash();setTimeout(()=>S.warning(),220);setTimeout(()=>S.boom(),620)},2950);setTimeout(()=>{clearInterval(inter);drawReels([randFood(),final,randFood()]);drawResult(final);setPhase("TODAY'S DESTINY");cut('none');S.boom();setTimeout(()=>S.shine(),250);spinning=false;rollBtn.textContent='开始处决';machine.classList.remove('shake');document.querySelectorAll('.reel').forEach(x=>x.classList.remove('spin'));flash.classList.remove('go')},3820)}
function initBg(){for(let i=0;i<30;i++){let l=document.createElement('i');l.className='line';l.style.top=Math.random()*100+'%';l.style.width=30+Math.random()*45+'%';l.style.transform=`rotate(${-10+Math.random()*20}deg)`;l.style.animationDelay=Math.random()*1+'s';lines.appendChild(l)}for(let i=0;i<46;i++){let d=document.createElement('i');d.className='dot';let s=3+Math.random()*9;d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.width=s+'px';d.style.height=s+'px';d.style.animationDelay=Math.random()*2+'s';particles.appendChild(d)}}
muteBtn.onclick=()=>{S.click();muted=!muted;bgm.muted=muted;muteBtn.textContent=muted?'🔇':'🔊'};bgmBtn.onclick=()=>{S.click();bgmIndex=(bgmIndex+1)%BGM.length;bgm.src=BGM[bgmIndex].src;bgmName.textContent=BGM[bgmIndex].name;bgm.play().catch(()=>{})};rollBtn.onclick=startRoll;initBg();drawReels([foods[5],foods[18],foods[77]]);drawResult(result);
</script>
</body>
</html>
