<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#e60012" />
  <title>命运晚餐处决老虎机</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div id="app">
    <div class="slash-white"></div>
    <div class="ring"></div>
    <div class="speedlines" id="speedlines"></div>
    <div class="particles" id="particles"></div>
    <div class="flash" id="flash"></div>
    <div class="cutin" id="cutin"></div>

    <main class="screen">
      <header class="top">
        <div>
          <div class="label">DINNER HEIST</div>
          <h1>命运晚餐<br>处决老虎机</h1>
          <div class="subtitle">LOW-POLY COMIC MENU MACHINE</div>
        </div>
        <div class="iconBtns">
          <button class="iconBtn" id="muteBtn" aria-label="静音">🔊</button>
          <button class="iconBtn red" id="bgmBtn" aria-label="切换音乐">♫</button>
          <button class="iconBtn dark" id="adminBtn" aria-label="后台">⚙</button>
        </div>
      </header>

      <section class="soundbar">
        <div>
          <b>BGM</b>
          <span id="bgmName">Last Surprise</span>
        </div>
        <label>
          <span>音量</span>
          <input id="volumeSlider" type="range" min="0" max="100" value="18" />
        </label>
      </section>

      <section class="machine" id="machine">
        <div class="status">
          <span class="phase" id="phase">IDLE</span>
          <span class="pool" id="pool">POOL 0</span>
        </div>
        <div class="reels">
          <div class="reel"><div class="foodInner" id="r0"></div></div>
          <div class="reel heroReel"><div class="foodInner" id="r1"></div></div>
          <div class="reel"><div class="foodInner" id="r2"></div></div>
        </div>
      </section>

      <section class="result" id="result"></section>

      <div class="cta">
        <button class="rollBtn" id="rollBtn">开始处决</button>
        <div class="tip">后台可改菜单、概率标签和控糖属性；首次点击解锁音乐与音效</div>
      </div>
    </main>

    <aside class="admin" id="adminPanel" aria-hidden="true">
      <div class="adminHead">
        <div>
          <span class="label">BACK OFFICE</span>
          <h2>菜单后台</h2>
        </div>
        <button class="iconBtn" id="closeAdminBtn" aria-label="关闭后台">×</button>
      </div>
      <form class="adminForm" id="foodForm">
        <input id="foodName" placeholder="食物名称" required />
        <select id="foodRarity">
          <option>N</option>
          <option>R</option>
          <option>SR</option>
          <option>SSR</option>
        </select>
        <input id="foodCalories" type="number" min="120" max="1200" placeholder="热量" value="520" />
        <input id="foodHealth" type="number" min="1" max="99" placeholder="健康值" value="60" />
        <label class="check"><input id="foodSugar" type="checkbox" /> 控糖 OK</label>
        <button type="submit">加入菜单</button>
      </form>
      <div class="adminTools">
        <button id="exportBtn">导出</button>
        <button id="importBtn">导入</button>
        <button id="resetBtn">重置</button>
      </div>
      <textarea id="jsonBox" spellcheck="false" placeholder="导出/导入菜单 JSON"></textarea>
      <div class="foodList" id="foodList"></div>
    </aside>
  </div>

  <audio id="bgm" loop preload="auto" src="assets/last_surprise.m4a"></audio>
  <script src="src/app.bundle.js"></script>
</body>
</html>
